[project]
name = "wiki-poc"
version = "0.1.0"
description = "POC: GitHub Wiki publicado a partir de docs/ e das docstrings"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # Parser de docstrings do mkdocstrings, usado aqui sem o mkdocs.
    "griffe>=2.4.1,<3",
    "pre-commit>=4.7.0,<5",
    "pyright>=1.1.414,<2",
    "pytest>=9.2.0,<10",
    "ruff>=0.17.6,<0.18",
]

[tool.uv]
required-version = ">=0.13.7,<0.14"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "T20", "B", "A", "ARG", "UP", "C4", "SIM", "PIE", "RET",
    "FURB", "PERF", "PGH", "ERA", "PT", "RUF", "S", "PLE", "PLW",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"

[tool.ruff.lint.isort]
known-first-party = ["wiki_poc", "scripts", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
# Doctest nos módulos: os `Examples:` que vão para o wiki rodam no CI.
addopts = "-vv --doctest-modules"
testpaths = ["src", "tests"]

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
exclude = [".venv", "build"]
typeCheckingMode = "strict"
